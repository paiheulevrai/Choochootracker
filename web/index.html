<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChooChooTracker — Web</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #000f1a; color: #a0d0f0; font: 16px system-ui, sans-serif; }
    main { width: min(100%, 980px); padding: 1rem; text-align: center; }
    h1 { color: #bfdf50; font-size: 1.15rem; letter-spacing: .12em; }
    p { color: #7098b8; }
    #tracker { display: block; width: min(100%, 640px); height: auto; aspect-ratio: 4 / 3;
      margin: 0 auto; border: 1px solid #284866; background: #000f1a;
      image-rendering: pixelated; }
    #status { color: #7ddcff; min-height: 1.5em; }
    button { color: #000f1a; background: #7ddcff; border: 0; padding: .55rem 1rem;
      font-weight: 700; cursor: pointer; }
    #touch-controls { display: none; grid-template-columns: repeat(4, 1fr);
      gap: .45rem; width: min(100%, 640px); margin: .75rem auto 0; }
    #touch-controls button { min-height: 3rem; padding: .25rem; touch-action: none;
      user-select: none; -webkit-user-select: none; }
    @media (pointer: coarse), (max-width: 700px) {
      main { width: min(100%, 640px); padding: .5rem; }
      #tracker { width: 100%; }
      #touch-controls { display: grid; width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>CHOOCHOO TRACKER / WEB</h1>
    <p>Click inside the tracker, then use the keyboard. Audio starts on first interaction.</p>
    <button id="start">Start tracker</button>
    <div id="status">Ready</div>
    <canvas id="tracker" tabindex="0" aria-label="ChooChooTracker"></canvas>
    <div id="touch-controls" aria-label="Touch controls">
      <button data-button="0">▲</button><button data-button="1">▼</button>
      <button data-button="2">◀</button><button data-button="3">▶</button>
      <button data-button="4">EDIT</button><button data-button="5">OPT</button>
      <button data-button="6">PLAY</button><button data-button="7">SHIFT</button>
    </div>
  </main>
  <script>
    const status = document.querySelector('#status');
    const start = document.querySelector('#start');
    let trackerStarted = false;
    const loadTracker = () => {
      if (trackerStarted) return;
      trackerStarted = true;
      start.hidden = true;
      document.querySelector('#tracker').focus();
      status.textContent = 'Loading tracker…';
      window.Module = window.Module || {};
      window.Module.canvas = document.querySelector('#tracker');
      window.Module.printErr = (message) => { status.textContent = message; };
      window.Module.onRuntimeInitialized = () => { status.textContent = 'Ready — enjoy the ride.'; };
      const script = document.createElement('script');
      script.src = 'choochootracker.js';
      script.onerror = () => { status.textContent = 'WebAssembly bundle not found.'; };
      document.body.appendChild(script);
    };
    start.addEventListener('click', loadTracker);
    window.addEventListener('load', loadTracker);

    document.querySelectorAll('#touch-controls button').forEach((button) => {
      const send = (down) => {
        if (window.Module && window.Module.ccall) {
          window.Module.ccall('webQueueButton', null, ['number', 'number'],
            [Number(button.dataset.button), down ? 1 : 0]);
        }
      };
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        send(true);
      });
      button.addEventListener('pointerup', (event) => {
        event.preventDefault();
        send(false);
      });
      button.addEventListener('pointercancel', () => send(false));
    });
  </script>
</body>
</html>
