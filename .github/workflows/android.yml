name: Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;30.0.16248370"
      - name: Prepare SDL2 headers
        run: |
          curl --fail --location --output /tmp/SDL2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          mkdir -p .tmp/SDL2-2.32.10/SDL2
          tar -xzf /tmp/SDL2.tar.gz -C /tmp
          cp -r /tmp/SDL2-2.32.10/include/. .tmp/SDL2-2.32.10/SDL2/
      - name: Build native libraries
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/30.0.16248370"
          make -C tracker -f Makefile.android android ARCH=arm64-v8a
          make -C tracker -f Makefile.android android ARCH=armeabi-v7a
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          CCT_KEYSTORE_B64: ${{ secrets.CCT_KEYSTORE_B64 }}
          CCT_KEYSTORE_PASSWORD: ${{ secrets.CCT_KEYSTORE_PASSWORD }}
          CCT_KEY_ALIAS: ${{ secrets.CCT_KEY_ALIAS }}
          CCT_KEY_PASSWORD: ${{ secrets.CCT_KEY_PASSWORD }}
        run: |
          test -n "$CCT_KEYSTORE_B64"
          printf '%s' "$CCT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/choochootracker.keystore"
          test -s "$RUNNER_TEMP/choochootracker.keystore"
          {
            echo "CCT_KEYSTORE_FILE=$RUNNER_TEMP/choochootracker.keystore"
            echo "CCT_KEYSTORE_PASSWORD=$CCT_KEYSTORE_PASSWORD"
            echo "CCT_KEY_ALIAS=$CCT_KEY_ALIAS"
            echo "CCT_KEY_PASSWORD=$CCT_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build APK and bundle
        working-directory: tracker/platforms/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleStoreRelease assembleDirectRelease bundleStoreRelease \
            -x buildNativeArm64 -x buildNativeArm32
      - uses: actions/upload-artifact@v4
        with:
          name: choochootracker-android
          path: |
            tracker/platforms/android/app/build/outputs/apk/*/release/*.apk
            tracker/platforms/android/app/build/outputs/bundle/storeRelease/*.aab
          if-no-files-found: error
