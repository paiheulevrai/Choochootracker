name: PS Vita

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tracker/Makefile.vita'
      - 'tracker/platforms/vita/**'
      - 'tracker/platforms/sdl2/**'
      - '.github/workflows/vita.yml'

permissions:
  contents: read

jobs:
  vita:
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:latest
    steps:
      - name: Install build tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash git make zip unzip
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git make zip unzip
          fi
      - name: Show toolchain
        run: |
          echo "VITASDK=$VITASDK"
          for tool in vdpm vita-pack-vpk arm-vita-eabi-g++ arm-vita-eabi-pkg-config make git unzip; do
            command -v "$tool" || echo "MISSING: $tool"
          done
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install SDL2 for the Vita
        # The package comes from a GitHub release download that now and then
        # times out ("Operation too slow"); retry instead of failing the run.
        run: |
          for attempt in 1 2 3 4 5; do
            if yes | vdpm install sdl2; then exit 0; fi
            echo "vdpm attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build VPK
        working-directory: tracker
        run: |
          set +e
          make -k -j"$(nproc)" -f Makefile.vita Vita-deploy > build.log 2>&1
          status=$?
          echo "make exit code: $status"
          echo "---- errors ----"
          grep -E "error|\*\*\*|undefined reference|cannot find|not found" build.log | head -80
          echo "---- last lines ----"
          tail -15 build.log
          exit $status
      - name: Check VPK
        run: |
          vpk="$(ls releases/ChooChooTracker-*-Vita.vpk)"
          unzip -tq "$vpk"
          unzip -l "$vpk" | grep -E 'eboot\.bin|sce_sys/param\.sfo|sce_sys/icon0\.png'
      - uses: actions/upload-artifact@v4
        with:
          name: ChooChooTracker-Vita
          path: releases/ChooChooTracker-*-Vita.vpk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ChooChooTracker-Vita-elf
          path: tracker/build/vita/choochootracker.elf
          if-no-files-found: warn
