name: PortMaster

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Replace the PortMaster ZIP and checksum in this existing release (optional)
        required: false
        type: string
  release:
    types: [published]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portmaster:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test PortMaster packaging and launcher
        run: |
          python3 -m unittest discover -s tracker/tests -p 'test_portmaster_*.py'
      - name: Build PortMaster package
        run: |
          image=ghcr.io/monkeyx-net/portmaster-build-templates/portmaster-builder:aarch64-latest
          docker pull "$image"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/tracker "$image" bash -lc \
            "apt-get update && apt-get install -y cmake curl pkg-config && \
              curl --fail --location --output /tmp/SDL2.tar.gz \
                https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz && \
              tar -xzf /tmp/SDL2.tar.gz -C /tmp && \
              cmake -S /tmp/SDL2-2.32.10 -B /tmp/SDL2-build \
                -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF && \
              cmake --build /tmp/SDL2-build -j4 && \
              cmake --install /tmp/SDL2-build && ldconfig && \
              sdl_pc=\$(find /usr/local -name sdl2.pc -print -quit) && \
              PKG_CONFIG_LIBDIR=\$(dirname \"\$sdl_pc\"):/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
                make -B -j4 -f Makefile.portmaster PortMaster-deploy NextUI-deploy \
              COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST' CXX=g++ STRIP=strip"
          unzip -t releases/choochootracker.zip
          unzip -t releases/ChooChooTracker.pak.zip
          # The binary alone is not a usable release: native chip and FM
          # preset libraries are loaded from these packaged asset paths.
          # Save the full listing so grep -q cannot terminate unzip early
          # and turn a successful match into a SIGPIPE failure under pipefail.
          unzip -Z1 releases/choochootracker.zip > releases/package-files.txt
          grep -Fxq 'choochootracker/data.tar.gz' releases/package-files.txt
          unzip -p releases/choochootracker.zip choochootracker/data.tar.gz > releases/data.tar.gz
          tar -tzf releases/data.tar.gz > releases/data-files.txt
          grep -Fxq './instruments/FACTORY/catalog.tsv' releases/data-files.txt
          grep -Fxq './instruments/FACTORY/builtins.tsv' releases/data-files.txt
          grep -Eq '^\./instruments/FACTORY/[^/]+\.zip$' releases/data-files.txt
          for engine in dx7 opll vrc7 opl2 opl3 genesis arcade sid sega gb-pulse gb-noise; do
            grep -Fxq "./instruments/USER/$engine/README.txt" releases/data-files.txt
          done
          grep -Fxq './licenses/miniz.txt' releases/data-files.txt
          binary=tracker/build/portmaster/choochootracker.aarch64
          readelf -h "$binary" | grep -q AArch64
          glibc=$(readelf -V "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          test "$(printf '%s\n' "$glibc" GLIBC_2.29 | sort -V | tail -1)" = GLIBC_2.29
          unzip -Z1 releases/ChooChooTracker.pak.zip > releases/nextui-package-files.txt
          grep -Fxq 'launch.sh' releases/nextui-package-files.txt
          grep -Fxq 'pak.json' releases/nextui-package-files.txt
          grep -Fxq 'choochootracker.aarch64' releases/nextui-package-files.txt
          grep -Fxq 'instruments/FACTORY/catalog.tsv' releases/nextui-package-files.txt
          test "$(unzip -p releases/ChooChooTracker.pak.zip pak.json)" = "$(cat pak.json)"
      - name: Prepare PortMaster Library sources
        env:
          PACKAGE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'preview' }}
        run: |
          [[ "$PACKAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          mkdir -p "$RUNNER_TEMP/library-input"
          archive="$RUNNER_TEMP/library-input/ChooChooTracker-${PACKAGE_TAG}-PortMaster.zip"
          cp releases/choochootracker.zip "$archive"
          (cd "$RUNNER_TEMP/library-input" && sha256sum *.zip > SHA256SUMS.txt)
          python3 scripts/prepare_portmaster_library.py prepare \
            --archive "$archive" \
            --checksums "$RUNNER_TEMP/library-input/SHA256SUMS.txt" \
            --output "$RUNNER_TEMP/portmaster-library" \
            --tag "$PACKAGE_TAG" --source-sha "$(git rev-parse HEAD)" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: choochootracker-portmaster-library
          path: ${{ runner.temp }}/portmaster-library/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: choochootracker-portmaster
          path: releases/choochootracker.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: choochootracker-nextui
          path: releases/ChooChooTracker.pak.zip
          if-no-files-found: error

  publish-nextui:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portmaster
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: choochootracker-nextui
          path: releases
      - name: Attach NextUI Pak to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" releases/ChooChooTracker.pak.zip --repo "$GITHUB_REPOSITORY" --clobber

  publish-portmaster:
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: portmaster
    runs-on: ubuntu-latest
    concurrency:
      group: release-asset-manifest
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: choochootracker-portmaster
          path: releases
      - name: Replace PortMaster archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[A-Za-z0-9._-]+$ ]]
          archive="releases/ChooChooTracker-${RELEASE_TAG}-PortMaster.zip"
          mv releases/choochootracker.zip "$archive"
          mkdir -p "$RUNNER_TEMP/release-checksums"
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/release-checksums"
          sums="$RUNNER_TEMP/release-checksums/SHA256SUMS.txt"
          python3 scripts/prepare_portmaster_library.py update-checksum \
            --archive "$archive" --checksums "$sums"
          gh release upload "$RELEASE_TAG" "$archive" --clobber
          gh release upload "$RELEASE_TAG" "$sums" --clobber
          mkdir -p "$RUNNER_TEMP/release-verify"
          gh release download "$RELEASE_TAG" --pattern "$(basename "$archive")" \
            --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/release-verify"
          cmp "$archive" "$RUNNER_TEMP/release-verify/$(basename "$archive")"
          cmp "$sums" "$RUNNER_TEMP/release-verify/SHA256SUMS.txt"
