name: Launchpad Mini MK3 hardware test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/launchpad-mini-mk3-test

permissions:
  contents: read

jobs:
  nextui-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the NextUI test executable
        run: |
          mkdir -p tracker/build/portmaster/launchpad-test
          chmod 777 tracker/build/portmaster/launchpad-test
          image=ghcr.io/monkeyx-net/portmaster-build-templates/portmaster-builder:aarch64-latest
          docker pull "$image"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/tracker "$image" bash -lc \
            "apt-get update && apt-get install -y cmake curl pkg-config && \
              curl --fail --location --output /tmp/SDL2.tar.gz \
                https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz && \
              tar -xzf /tmp/SDL2.tar.gz -C /tmp && \
              cmake -S /tmp/SDL2-2.32.10 -B /tmp/SDL2-build \
                -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF && \
              cmake --build /tmp/SDL2-build -j4 && \
              cmake --install /tmp/SDL2-build && ldconfig && \
              sdl_pc=\$(find /usr/local -name sdl2.pc -print -quit) && \
              PKG_CONFIG_LIBDIR=\$(dirname \"\$sdl_pc\"):/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
                make -B -j4 -f Makefile.portmaster NextUI \
              COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST' CXX=g++ STRIP=strip"
          binary=tracker/build/portmaster/choochootracker.aarch64
          readelf -h "$binary" | grep -q AArch64
          glibc=$(readelf -V "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          test "$(printf '%s\n' "$glibc" GLIBC_2.29 | sort -V | tail -1)" = GLIBC_2.29
          cp "$binary" tracker/build/portmaster/launchpad-test/choochootracker-launchpad-test.aarch64
          cp tracker/packaging/nextui/launchpad-test.sh tracker/build/portmaster/launchpad-test/launch.sh
          cp tracker/packaging/nextui/launchpad-test-pak.json tracker/build/portmaster/launchpad-test/pak.json
      - uses: actions/upload-artifact@v4
        with:
          name: launchpad-test-arm64
          path: tracker/build/portmaster/launchpad-test/*
          if-no-files-found: error
