  <path d="M276 946v396M78 1144h396" stroke="#49454F" stroke-width="2"/>
  <g fill="#E6E0E9" font-family="Roboto,Arial,sans-serif" font-size="46" text-anchor="middle"><text x="276" y="1050">↑</text><text x="158" y="1160">←</text><text x="394" y="1160">→</text><text x="276" y="1282">↓</text></g>
  <circle cx="836" cy="1036" r="126" fill="#F2B8B5"/><text x="836" y="1028" text-anchor="middle" fill="#601410" font-family="Roboto,Arial,sans-serif" font-size="28">A</text><text x="836" y="1070" text-anchor="middle" fill="#601410" font-family="Roboto,Arial,sans-serif" font-size="34" font-weight="500">EDIT</text>
  <circle cx="664" cy="1288" r="118" fill="#D0BCFF"/><text x="664" y="1280" text-anchor="middle" fill="#381E72" font-family="Roboto,Arial,sans-serif" font-size="28">B</text><text x="664" y="1322" text-anchor="middle" fill="#381E72" font-family="Roboto,Arial,sans-serif" font-size="34" font-weight="500">OPT</text>
  <rect x="792" y="1190" width="236" height="194" rx="28" fill="#4A4458"/><text x="910" y="1268" text-anchor="middle" fill="#E6E0E9" font-family="Roboto,Arial,sans-serif" font-size="29">START</text><text x="910" y="1312" text-anchor="middle" fill="#E6E0E9" font-family="Roboto,Arial,sans-serif" font-size="34" font-weight="500">PLAY</text>
  <rect x="544" y="1420" width="250" height="168" rx="28" fill="#4A4458"/><text x="669" y="1488" text-anchor="middle" fill="#E6E0E9" font-family="Roboto,Arial,sans-serif" font-size="29">SELECT</text><text x="669" y="1532" text-anchor="middle" fill="#E6E0E9" font-family="Roboto,Arial,sans-serif" font-size="34" font-weight="500">SHIFT</text>
  <path d="M46 1668h988" stroke="#49454F" stroke-width="2"/>
  <!-- Live-motion controls stay in their original bottom band. -->
  <circle cx="180" cy="1900" r="132" fill="#211F26" stroke="#79747E" stroke-width="2"/><circle cx="180" cy="1900" r="48" fill="#CAC4D0"/>
  <circle cx="900" cy="1900" r="132" fill="#211F26" stroke="#79747E" stroke-width="2"/><circle cx="900" cy="1900" r="48" fill="#CAC4D0"/>
  <rect x="380" y="1828" width="136" height="144" rx="18" fill="#4F378B"/><text x="448" y="1915" text-anchor="middle" fill="#FFFFFF" font-family="Roboto,Arial,sans-serif" font-size="30" font-weight="500">REC</text>
  <rect x="564" y="1828" width="136" height="144" rx="18" fill="#4A4458"/><text x="632" y="1915" text-anchor="middle" fill="#E6E0E9" font-family="Roboto,Arial,sans-serif" font-size="30" font-weight="500">DEL</text>
  <!-- Standard Android navigation. -->
  <rect y="2184" width="1080" height="216" fill="#211F26"/><g fill="#CAC4D0" font-family="Roboto,Arial,sans-serif" font-size="23" text-anchor="middle"><text x="180" y="2330">Project</text><text x="540" y="2330">Instruments</text><text x="900" y="2330">Settings</text></g><circle cx="540" cy="2264" r="32" fill="#D0BCFF"/><path d="M524 2264h32m-16-16v32" stroke="#381E72" stroke-width="5" stroke-linecap="round"/>
</svg>
