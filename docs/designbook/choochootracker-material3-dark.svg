<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2400" viewBox="0 0 1080 2400">
  <title>ChooChooTracker, tracker layout in Material 3 dark mode</title>
  <rect width="1080" height="2400" fill="#141218"/>
  <text x="54" y="58" fill="#E6E0E9" font-family="Roboto,Arial,sans-serif" font-size="28">9:41</text>
  <path d="M915 42h12m10 0h12m10 0h18" stroke="#E6E0E9" stroke-width="5" stroke-linecap="round"/>
  <!-- Existing 4:3 tracker canvas: same content hierarchy and position. -->
  <rect x="24" y="96" width="1032" height="774" rx="24" fill="#1D1B20"/>
  <text x="56" y="164" fill="#D0BCFF" font-family="Roboto Mono,monospace" font-size="34" font-weight="700">INSTRUMENT 00</text>
  <text x="56" y="244" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">Type</text><text x="272" y="244" fill="#D0BCFF" font-family="Roboto Mono,monospace" font-size="31">Sample</text><text x="690" y="244" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">Load   Save</text>
  <text x="56" y="292" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">Name</text><text x="272" y="292" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">Dub kick</text>
  <text x="56" y="340" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">Transp.</text><text x="272" y="340" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">On</text><text x="466" y="340" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">Tbl.Tic 01</text><text x="750" y="340" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">Vol FF</text>
  <text x="56" y="430" fill="#D0BCFF" font-family="Roboto Mono,monospace" font-size="31" font-weight="700">SOURCE</text><text x="506" y="430" fill="#D0BCFF" font-family="Roboto Mono,monospace" font-size="31" font-weight="700">FILTER</text>
  <g fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31"><text x="56" y="480">Sample    0D3.WAV</text><text x="56" y="528">Pitch     −12 st</text><text x="56" y="576">Start     00</text><text x="56" y="624">End       A6</text><text x="56" y="672">Loop      Off</text><text x="56" y="720">Speed     100%</text><text x="506" y="480">Type      Off</text><text x="506" y="528">Mode      LP</text><text x="506" y="576">Slope     12 dB</text><text x="506" y="624">Cutoff    20000 Hz</text><text x="506" y="672">Reso      00</text></g>
  <text x="56" y="790" fill="#D0BCFF" font-family="Roboto Mono,monospace" font-size="31" font-weight="700">ADSR</text><text x="218" y="790" fill="#E6E0E9" font-family="Roboto Mono,monospace" font-size="31">A00  D50  S00  R00   Shape 80</text>
  <path d="M64 834 C88 760 108 850 144 810 S212 790 250 820 S326 830 368 800 S454 798 500 822 S590 830 640 808 S720 804 760 818" fill="none" stroke="#D0BCFF" stroke-width="4"/>
