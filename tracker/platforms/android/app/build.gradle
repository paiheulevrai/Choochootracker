plugins {
    id 'com.android.application'
}

def signingFile = rootProject.file('keystore.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signingStoreFile = System.getenv('CCT_KEYSTORE_FILE') ?: signingProps['storeFile']
def signingStorePassword = System.getenv('CCT_KEYSTORE_PASSWORD') ?: signingProps['storePassword']
def signingKeyAlias = System.getenv('CCT_KEY_ALIAS') ?: signingProps['keyAlias']
def signingKeyPassword = System.getenv('CCT_KEY_PASSWORD') ?: signingProps['keyPassword']
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def androidSdk = System.getenv('ANDROID_HOME') ?: localProps['sdk.dir']
def androidNdk = System.getenv('ANDROID_NDK_ROOT') ?: "${androidSdk}/ndk/30.0.16248370"

// Custom task to build native code using external makefiles and copy the results
task buildNativeArm64(type: Exec) {
    def multiplatformProjectRoot = rootProject.projectDir.parentFile.parentFile
    workingDir multiplatformProjectRoot
    commandLine 'C:/msys64/usr/bin/bash.exe', '-c', 'export PATH=/ucrt64/bin:/usr/bin:$PATH; make -f Makefile.android android ARCH=arm64-v8a'
    environment 'ANDROID_NDK_ROOT', androidNdk
}

task buildNativeArm32(type: Exec) {
    def multiplatformProjectRoot = rootProject.projectDir.parentFile.parentFile
    workingDir multiplatformProjectRoot
    commandLine 'C:/msys64/usr/bin/bash.exe', '-c', 'export PATH=/ucrt64/bin:/usr/bin:$PATH; make -f Makefile.android android ARCH=armeabi-v7a'
    environment 'ANDROID_NDK_ROOT', androidNdk
}

task copyNativeLibs(type: Copy) {
    dependsOn buildNativeArm64, buildNativeArm32
    
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    
    def multiplatformProjectRoot = rootProject.projectDir.parentFile.parentFile
    
    from(new File(multiplatformProjectRoot, 'build/android-arm64')) {
        into 'arm64-v8a'
        include 'libchipnomad.so'
    }
    from(new File(multiplatformProjectRoot, 'build/android-arm32')) {
        into 'armeabi-v7a'
        include 'libchipnomad.so'
    }
    
    into new File(project.projectDir, 'src/main/jniLibs')
}

// Make the build process depend on our custom task
preBuild.dependsOn copyNativeLibs

android {
    namespace 'com.paiheulevrai.choochootracker'
    compileSdk 36

    defaultConfig {
        applicationId "com.paiheulevrai.choochootracker"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0"
    }

    // Copy bundled tracker content to assets.
    task copyChooChooTrackerAssets(type: Copy) {
        from '../../../packaging/common'  // Use existing packaging folder
        into 'src/main/assets/choochootracker_data'
        include '**/*'
        exclude '**/.git*'
    }

    // Make sure assets are copied before building
    preBuild.dependsOn copyChooChooTrackerAssets

    signingConfigs {
        release {
            if (signingStoreFile) {
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            if (signingStoreFile) signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    lintOptions {
        abortOnError false
    }
    
    // This tells Gradle where to find the .so files after we copy them
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
